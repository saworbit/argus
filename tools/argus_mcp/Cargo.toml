[package]
name = "argus-mcp"
version = "0.24.0"
edition = "2021"
description = "Argus lab MCP server: cartographer, compile, match, A/B, deploy wizard"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md5 = "0.8"
regex = "1"
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[lib]
name = "argus_mcp"
path = "src/lib.rs"

[[bin]]
name = "argus-mcp"
path = "src/main.rs"
