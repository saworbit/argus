name: Bug report
description: Report unexpected bot behaviour, a physics glitch, an engine crash or a tooling error.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Argus. A bug that can be reproduced gets fixed first, so the more detail the better.
        Security problems do not belong here: report them privately through the [security policy](https://github.com/saworbit/argus/security/policy).

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched [existing issues](https://github.com/saworbit/argus/issues?q=is%3Aissue), open and closed, and this is not a duplicate.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Component
      description: Which part of Argus is affected?
      options:
        - "Bot AI and decision making"
        - "Movement, physics and hazards"
        - "Combat and aim"
        - "Navigation graph and routing"
        - "Engine compatibility and crashes"
        - "Lab MCP server and GUI (argus-mcp)"
        - "Telemetry and Python tooling (analyze_match.py, navgen)"
        - "Build and compilation (fteqcc)"
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Argus build
      description: The release tag, the source commit, or the MD5 of the `progs.dat` you ran.
      placeholder: "e.g. v4.07, commit c41d408, or MD5 ED8926C1..."
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Engine and version
      description: For example QuakeSpasm, Ironwail, vkQuake, FTEQW, DarkPlaces, the 2021 re-release (KEX) or a NetQuake dedicated server, with platform.
      placeholder: "e.g. Ironwail 0.8.2, Windows 64-bit"
    validations:
      required: true

  - type: input
    id: map
    attributes:
      label: Map
      description: Which map did this happen on?
      placeholder: "e.g. dm4"
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: How was it running?
      options:
        - "Human play (listen server)"
        - "Automated lab or dedicated botmatch"
        - "Not applicable (tooling only)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The launch command and what you did.
      placeholder: |
        1. Launch: quakespasm -listen 8 -game argus -condebug +developer 1 +deathmatch 1 +map dm4
        2. Wait for Carmack to reach ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console or telemetry log
      description: Relevant lines from `qconsole.log`, especially `ARGLOG`, `ARGEVT` or `Host_Error`. Telemetry needs both `-condebug` and `+developer 1`.
      render: text
    validations:
      required: false
