name: Feature request
description: Suggest a bot personality, an AI mechanic, a weapon tactic or a lab tool.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Bot code must stay **vanilla QuakeC: NetQuake protocol 15, at most 600 edicts, no engine extensions and no file I/O**, so a feature that needs an engine change is out of scope for the mod (the offline tools and the lab have more room).
        Open-ended ideas can start in [Discussions](https://github.com/saworbit/argus/discussions/categories/ideas) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched [existing issues](https://github.com/saworbit/argus/issues?q=is%3Aissue), open and closed, and this has not been proposed or declined already.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - "Bot AI and tactics"
        - "Bot personalities and the homage roster"
        - "Navigation and physics"
        - "Telemetry and visualisation"
        - "Lab MCP server and GUI"
        - "Tooling and navgen"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or behaviour prompted this?
      placeholder: "I noticed bots struggle when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
    validations:
      required: false
