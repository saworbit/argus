name: fuzz

# Coverage-guided fuzzing of the lab's three external-input parsers (#849):
# the protocol 15 demo reader, the BSP and PAK reader and the ARGLOG tape
# parser, one cargo-fuzz target each (tools/argus_mcp/fuzz). libFuzzer needs
# nightly while rust-toolchain.toml pins stable, so this runs weekly and by
# hand, never on a pull request; the stable suite carries the same contract
# as a bounded mutation test (tools/argus_mcp/tests/parser_robustness.rs).
#
# Seeds come from committed runs/*.log tapes and LibreQuake's free maps only.
# id Software maps and demos are licensed data and never become corpus.
#
# A crash or a hang fails the job and uploads its input. Commit it as a
# stable regression test in the module it broke, then the fix.
on:
  schedule:
    - cron: '41 3 * * 6'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target in seconds (at most 3600)
        type: number
        default: 600

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [demo, bsp, arglog]
    env:
      # pinned like every other input; move them deliberately
      NIGHTLY: nightly-2026-11-15
      CARGO_FUZZ_VERSION: 0.13.1
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"

      - name: Fetch LibreQuake maps (free content, pinned release, checksum verified)
        if: matrix.target == 'bsp'
        env:
          REL: https://github.com/lavenderdotpet/LibreQuake/releases/download/v0.09-beta
        run: |
          mkdir -p lq-data
          curl -fsSL -o lq-data/server.zip "$REL/server.zip"
          # the same pin the compile workflow verifies
          grep ' lq-data/server.zip$' .github/librequake.sha256 | sha256sum -c -
          unzip -q lq-data/server.zip -d "$RUNNER_TEMP/lq-server"

      - name: Build the seed corpus
        run: |
          maps=()
          if [ "$TARGET" = bsp ]; then
            maps=(--maps "$RUNNER_TEMP/lq-server")
          fi
          python3 tools/argus_mcp/fuzz/seed_corpus.py --out "$RUNNER_TEMP/corpus" "${maps[@]}"

      - name: Build the fuzz target
        working-directory: tools/argus_mcp
        run: |
          # cargo fuzz has no --locked; a fetch with it fails on a stale lock
          cargo +"$NIGHTLY" fetch --locked --manifest-path fuzz/Cargo.toml
          cargo +"$NIGHTLY" fuzz build "$TARGET"

      - name: Fuzz for a bounded time
        working-directory: tools/argus_mcp
        env:
          SECONDS_ASKED: ${{ inputs.seconds }}
        run: |
          secs="${SECONDS_ASKED:-600}"
          case "$secs" in
            ''|*[!0-9]*) echo "::error::seconds must be a whole number, got '$secs'"; exit 1 ;;
          esac
          if [ "$secs" -lt 1 ] || [ "$secs" -gt 3600 ]; then
            echo "::error::seconds must be between 1 and 3600, got $secs"
            exit 1
          fi
          # -timeout reports any input that runs over 10 s as a hang
          cargo +"$NIGHTLY" fuzz run "$TARGET" "$RUNNER_TEMP/corpus/$TARGET" -- \
            -max_total_time="$secs" -timeout=10 -print_final_stats=1

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: tools/argus_mcp/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
