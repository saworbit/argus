name: compile

on:
  push:
    branches: [main]
  pull_request:
    # main stays UNFILTERED on purpose. PRs here merge minutes apart,
    # so a merge commit's tree is not always the PR head's tree, and
    # main is the branch every install is cut from.
    paths:
      - 'src/**'
      - 'game/**'
      - 'tools/argus_reach.py'
      - '.github/workflows/compile.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quakec:
    name: fteqcc compile (id format)
    # Keep compiler and package inputs stable across latest-image moves (#450).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache fteqcc
        id: cache-fteqcc
        uses: actions/cache@v6
        with:
          path: fteqw/engine/release/fteqcc
          # the SHA is IN the key on purpose: before this, a fixed key
          # meant the compiler was whatever landed in the cache first,
          # and an eviction moved it with nothing said
          key: fteqcc-${{ runner.os }}-f937b9d88f71fc4429db5fe56c6a98d922711b2e

      - name: Build fteqcc from fteqw git
        if: steps.cache-fteqcc.outputs.cache-hit != 'true'
        run: |
          # apt's fteqcc is years too old for this tree (setup_rig.sh
          # gotcha list); build the modern one from source, pinned to
          # the commit the lab rig ships from
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev
          git clone -q https://github.com/fte-team/fteqw.git
          git -C fteqw checkout -q f937b9d88f71fc4429db5fe56c6a98d922711b2e
          make -C fteqw/engine qcc-rel

      - name: Compile QuakeC
        run: |
          # progs.src writes ../lq1/progs.dat; the dir must exist first,
          # and fteqcc exits 0 even when the output write fails - trust
          # the id-format finish line and a fresh progs.dat, never the
          # exit code
          mkdir -p lq1
          rm -f lq1/progs.dat
          (cd src && ../fteqw/engine/release/fteqcc 2>&1 | tee ../compile.log) || true
          grep -q 'Compile finished.*id format' compile.log || { echo 'COMPILE FAILED: no id-format finish line'; tail -40 compile.log; exit 1; }
          [ -f lq1/progs.dat ] || { echo 'COMPILE FAILED: no progs.dat written'; exit 1; }
          ls -l lq1/progs.dat

      - name: Upload progs.dat for the smoke job
        uses: actions/upload-artifact@v7
        with:
          name: progs
          path: lq1/progs.dat

  smoke:
    name: headless stability smoke (LibreQuake)
    needs: quakec
    # Run the engine on the same explicit image that built its progs.dat.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: progs
          path: lq1
      - name: Cache LibreQuake data
        id: cache-lq
        uses: actions/cache@v6
        with:
          path: lq-data
          key: libquake-v0.09-beta
      - name: Fetch LibreQuake (free content, pinned release)
        if: steps.cache-lq.outputs.cache-hit != 'true'
        run: |
          REL=https://github.com/lavenderdotpet/LibreQuake/releases/download/v0.09-beta
          mkdir -p lq-data
          # -f or a 404 writes the HTML error body into the zip and
          # the cache key then keeps the poisoned file forever (#221)
          curl -fsSL -o lq-data/lite.zip   $REL/lite.zip
          curl -fsSL -o lq-data/server.zip $REL/server.zip
      - name: Run a botmatch and judge it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq quakespasm unzip python3
          unzip -q -o lq-data/lite.zip   -d lq-lite
          unzip -q -o lq-data/server.zip -d lq-server
          mkdir -p quake/id1/maps quake/argus maps_local
          cp lq-lite/lite/id1/pak0.pak lq-lite/lite/id1/pak1.pak quake/id1/
          cp lq-server/server/maps/*.bsp quake/id1/maps/
          cp lq-server/server/maps/lqdm2.bsp maps_local/
          cp lq1/progs.dat game/argus/autoexec.cfg quake/argus/
          # the stability smoke (mre review item 9): 60 s of bots on
          # lqdm2, no crash, no runaway, telemetry flowing
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 90 \
            quakespasm -dedicated 8 -basedir "$PWD/quake" -game argus \
            +developer 1 +sys_ticrate 0.0139 +deathmatch 1 +map lqdm2 > smoke.log 2>&1 || true
          grep -q 'ARGLOG' smoke.log || { echo 'SMOKE FAILED: no telemetry'; tail -40 smoke.log; exit 1; }
          ! grep -qE 'Host_Error|runaway loop|NULL function' smoke.log || { echo 'SMOKE FAILED: engine error'; grep -nE 'Host_Error|runaway loop|NULL function' smoke.log; exit 1; }
          grep -c 'ARGLOG' smoke.log
      - name: Directed-reach gate (free-content map)
        run: python3 tools/argus_reach.py lqdm2

      - name: Report the smoke tape (advisory, never fails)
        if: always()
        run: |
          # the job already runs a real 90 s botmatch and then throws
          # everything away except "did it crash". This reads it with
          # the lab's own battery. ADVISORY ON PURPOSE: all five
          # committed lqdm2 tapes read zero freezes, but they predate
          # the tick pin, so CI has no baseline at the rate it runs
          # until these accumulate
          {
            echo '## lqdm2 smoke tape'
            echo '```'
            python3 tools/argus_review.py summary smoke.log 2>&1 | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the smoke tape
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-tape
          path: smoke.log
          if-no-files-found: warn
