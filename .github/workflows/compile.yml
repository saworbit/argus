name: compile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quakec:
    name: fteqcc compile (id format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache fteqcc
        id: cache-fteqcc
        uses: actions/cache@v6
        with:
          path: fteqw/engine/release/fteqcc
          key: fteqcc-${{ runner.os }}-v1

      - name: Build fteqcc from fteqw git
        if: steps.cache-fteqcc.outputs.cache-hit != 'true'
        run: |
          # apt's fteqcc is years too old for this tree (setup_rig.sh
          # gotcha list); build the modern one from source
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev
          git clone -q --depth 1 https://github.com/fte-team/fteqw.git
          make -C fteqw/engine qcc-rel

      - name: Compile QuakeC
        run: |
          # progs.src writes ../lq1/progs.dat; the dir must exist first,
          # and fteqcc exits 0 even when the output write fails - trust
          # the id-format finish line and a fresh progs.dat, never the
          # exit code
          mkdir -p lq1
          rm -f lq1/progs.dat
          (cd src && ../fteqw/engine/release/fteqcc 2>&1 | tee ../compile.log) || true
          grep -q 'Compile finished.*id format' compile.log || { echo 'COMPILE FAILED: no id-format finish line'; tail -40 compile.log; exit 1; }
          [ -f lq1/progs.dat ] || { echo 'COMPILE FAILED: no progs.dat written'; exit 1; }
          ls -l lq1/progs.dat

      - name: Upload progs.dat for the smoke job
        uses: actions/upload-artifact@v7
        with:
          name: progs
          path: lq1/progs.dat

  lab:
    name: lab test suite (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/argus_mcp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/argus_mcp/Cargo.lock') }}
      - name: Run the lab suite
        # machine-local fixtures (maps_local BSPs, runs/demos) self-skip;
        # the committed runs/*.log regression tapes run in full
        run: cargo test --manifest-path tools/argus_mcp/Cargo.toml --lib

      - name: Run Python developer CLI tests
        run: python3 tools/test_tools_cli.py

  smoke:
    name: headless stability smoke (LibreQuake)
    needs: quakec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: progs
          path: lq1
      - name: Cache LibreQuake data
        id: cache-lq
        uses: actions/cache@v6
        with:
          path: lq-data
          key: libquake-v0.09-beta
      - name: Fetch LibreQuake (free content, pinned release)
        if: steps.cache-lq.outputs.cache-hit != 'true'
        run: |
          REL=https://github.com/lavenderdotpet/LibreQuake/releases/download/v0.09-beta
          mkdir -p lq-data
          curl -sL -o lq-data/lite.zip   $REL/lite.zip
          curl -sL -o lq-data/server.zip $REL/server.zip
      - name: Run a botmatch and judge it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq quakespasm unzip python3
          unzip -q -o lq-data/lite.zip   -d lq-lite
          unzip -q -o lq-data/server.zip -d lq-server
          mkdir -p quake/id1/maps quake/argus maps_local
          cp lq-lite/lite/id1/pak0.pak lq-lite/lite/id1/pak1.pak quake/id1/
          cp lq-server/server/maps/*.bsp quake/id1/maps/
          cp lq-server/server/maps/lqdm2.bsp maps_local/
          cp lq1/progs.dat game/argus/autoexec.cfg quake/argus/
          # the stability smoke (mre review item 9): 60 s of bots on
          # lqdm2, no crash, no runaway, telemetry flowing
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 90 \
            quakespasm -dedicated 8 -basedir "$PWD/quake" -game argus \
            +developer 1 +deathmatch 1 +map lqdm2 > smoke.log 2>&1 || true
          grep -q 'ARGLOG' smoke.log || { echo 'SMOKE FAILED: no telemetry'; tail -40 smoke.log; exit 1; }
          ! grep -qE 'Host_Error|runaway loop|NULL function' smoke.log || { echo 'SMOKE FAILED: engine error'; grep -nE 'Host_Error|runaway loop|NULL function' smoke.log; exit 1; }
          grep -c 'ARGLOG' smoke.log
      - name: Directed-reach gate (free-content map)
        run: python3 tools/argus_reach.py lqdm2
