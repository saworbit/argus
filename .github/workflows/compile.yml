name: compile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quakec:
    name: fteqcc compile (id format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache fteqcc
        id: cache-fteqcc
        uses: actions/cache@v4
        with:
          path: fteqw/engine/release/fteqcc
          key: fteqcc-${{ runner.os }}-v1

      - name: Build fteqcc from fteqw git
        if: steps.cache-fteqcc.outputs.cache-hit != 'true'
        run: |
          # apt's fteqcc is years too old for this tree (setup_rig.sh
          # gotcha list); build the modern one from source
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev
          git clone -q --depth 1 https://github.com/fte-team/fteqw.git
          make -C fteqw/engine qcc-rel

      - name: Compile QuakeC
        run: |
          # progs.src writes ../lq1/progs.dat; the dir must exist first,
          # and fteqcc exits 0 even when the output write fails - trust
          # the id-format finish line and a fresh progs.dat, never the
          # exit code
          mkdir -p lq1
          rm -f lq1/progs.dat
          (cd src && ../fteqw/engine/release/fteqcc 2>&1 | tee ../compile.log) || true
          grep -q 'Compile finished.*id format' compile.log || { echo 'COMPILE FAILED: no id-format finish line'; tail -40 compile.log; exit 1; }
          [ -f lq1/progs.dat ] || { echo 'COMPILE FAILED: no progs.dat written'; exit 1; }
          ls -l lq1/progs.dat
