name: fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: repo invariants
    # Keep the blocking gate stable across ubuntu-latest image migrations (#450).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Collect the changed-file list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # fetch-depth 0 against a 198 MB .git would cost more than
          # this whole job; one compare call fetches no history at all
          : > changed.txt
          : > commit_msgs.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate \
              "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              --jq '.files[] | if .status == "renamed" then "\(.status)\t\(.previous_filename)\t\(.filename)" else "\(.status)\t\(.filename)" end' > changed.txt
            gh api --paginate \
              "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              --jq '.commits[].commit.message' > commit_msgs.txt
            # a pull request always changes at least one file, so an
            # empty list here means the compare call gave us nothing
            # rather than that there is nothing to check. Left alone,
            # the tapes check would report "skipped" and the run would
            # go green having checked no tape at all - the vacuous pass
            # this whole guard family exists to prevent
            if [ ! -s changed.txt ]; then
              echo "::error::the compare API returned no changed files for this pull request, so the tapes check would have passed without checking anything"
              exit 1
            fi
          fi
          wc -l < changed.txt

      - name: Run the invariant battery
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 tools/argus_ci.py all \
            --changed-files changed.txt \
            --commit-msg "$PR_TITLE $(cat commit_msgs.txt)"

  lab:
    name: lab test suite (rust)
    # Match the invariant job's explicit base image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/argus_mcp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'tools/argus_mcp/Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/argus_mcp/Cargo.toml -- --check

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/argus_mcp/Cargo.toml --all-targets -- -D warnings

      - name: Run the lab suite
        # machine-local fixtures (maps_local BSPs, runs/demos) self-skip;
        # the committed runs/*.log regression tapes run in full
        run: cargo test --manifest-path tools/argus_mcp/Cargo.toml --lib

      - name: Build the developer CLI
        run: cargo build --manifest-path tools/argus_mcp/Cargo.toml --bin argus-mcp

      - name: Run Python developer CLI tests
        env:
          ARGUS_REQUIRE_SOURCE_MCP: "1"
        run: python3 tools/test_tools_cli.py
