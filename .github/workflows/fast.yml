name: fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel superseded pull request runs only; every main commit keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invariants:
    name: repo invariants
    # Keep the blocking gate stable across ubuntu-latest image migrations (#450).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the changed-file list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # fetch-depth 0 against a 198 MB .git would cost more than
          # this whole job; one compare call fetches no history at all
          : > changed.txt
          : > commit_msgs.txt
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate \
              "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
              --jq '.files[] | if .status == "renamed" then "\(.status)\t\(.previous_filename)\t\(.filename)" else "\(.status)\t\(.filename)" end' > changed.txt
            gh api --paginate \
              "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
              --jq '.commits[].commit.message' > commit_msgs.txt
            # a pull request always changes at least one file, so an
            # empty list here means the compare call gave us nothing
            # rather than that there is nothing to check. Left alone,
            # the tapes check would report "skipped" and the run would
            # go green having checked no tape at all - the vacuous pass
            # this whole guard family exists to prevent
            if [ ! -s changed.txt ]; then
              echo "::error::the compare API returned no changed files for this pull request, so the tapes check would have passed without checking anything"
              exit 1
            fi
          fi
          wc -l < changed.txt

      - name: Run the invariant battery
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 tools/argus_ci.py all \
            --changed-files changed.txt \
            --commit-msg="$PR_TITLE $(cat commit_msgs.txt)"

  lab:
    name: lab test suite (rust)
    # Match the invariant job's explicit base image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/argus_mcp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'tools/argus_mcp/Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/argus_mcp/Cargo.toml -- --check

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/argus_mcp/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path tools/argus_mcp/Cargo.toml --no-deps --locked

      - name: Run the lab suite
        # machine-local fixtures (maps_local BSPs, runs/demos) self-skip;
        # the committed runs/*.log regression tapes run in full
        run: cargo test --manifest-path tools/argus_mcp/Cargo.toml --locked --tests

      - name: Build the developer CLI
        run: cargo build --manifest-path tools/argus_mcp/Cargo.toml --locked --bin argus-mcp

      - name: Check MCP error responses
        env:
          ARGUS_LAB: tools/argus_mcp/target/debug/argus-mcp
        run: python3 tools/test_mcp_errors.py

      - name: Run Python developer CLI tests
        env:
          ARGUS_REQUIRE_SOURCE_MCP: "1"
        run: python3 tools/test_tools_cli.py

      - name: Run Python navigation reader tests
        run: |
          python3 tools/test_argus_navjson.py
          python3 tools/test_nav_tactics.py
          python3 tools/test_nav_artifacts.py
          python3 tools/test_jump_anchor.py
          python3 tools/test_navmesh_repair.py
          python3 tools/test_navmesh_air.py
          python3 tools/test_navmesh_typed.py
          python3 tools/test_argus_bsp.py
          python3 -O tools/test_argus_bsp.py
          python3 tools/test_ci_validation.py

      - name: Run Python tape parity tests
        run: python3 tools/test_argus_tape.py

      - name: Run lab spine tests
        run: python3 tools/test_argus_lab.py

      - name: Run build identity, gallery and instrument tool tests
        run: |
          python3 tools/test_argus_build_stamp.py
          python3 tools/test_argus_gallery.py
          python3 tools/test_argus_instrument_tools.py

      - name: Run passive behaviour diagnostics and fixture contract tests
        run: python3 -m unittest discover -s tools -p 'test_behaviour*.py'

      - name: Run observation boundary and tactical fixture tests
        run: |
          python3 -m pip install --require-hashes -r .github/requirements/perception.txt
          python3 -m unittest discover -s tools -p 'test_perception*.py'
          python3 -O tools/test_perception_health.py
          python3 -O tools/test_perception_fixture.py
          python3 tools/test_tactic_fixture.py
          python3 tools/test_target_attention.py
          python3 tools/test_water_route.py
          python3 tools/test_water_route_preflight.py
          python3 tools/test_argus_nav_anchors.py

      - name: Run rocket clearance and local review contracts
        run: |
          python3 tools/test_muzzle_fixture.py
          python3 tools/test_muzzle_combat.py
          python3 -O tools/test_muzzle_combat.py
          python3 tools/test_button_physical.py
          python3 tools/test_door_actuator.py
          python3 tools/test_review_outputs.py
          python3 tools/test_plan_progress.py
          python3 tools/test_offset_entry.py
          python3 tools/test_private_fixtures.py
          python3 tools/test_compile_private_fixtures.py

      - name: Run Python playability gate tests
        run: python3 tools/test_argus_mapgate.py

      - name: Run navigation budgets and study receipt contracts
        run: |
          python3 tools/test_nav_budget.py
          python3 -O tools/test_map_intelligence_report.py
          python3 tools/test_study_comparison.py
          python3 tools/test_study_validation.py
          python3 tools/test_freeze_recovery.py
          python3 tools/test_mover_transfer.py
          python3 tools/test_mover_forecast.py
          python3 tools/test_camera_chase.py
          python3 tools/test_startup_skill.py
          python3 tools/test_stall_ownership.py
          python3 tools/test_motion.py
          python3 tools/test_ally_barrel.py
          python3 tools/test_water_ownership.py
          python3 tools/test_mover_predicates.py
          python3 tools/test_body_height.py
          python3 tools/test_body_nudge.py
          python3 tools/test_cover_hop.py
