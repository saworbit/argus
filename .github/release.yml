# Generated release notes: groups merged pull requests by label.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
# .github/workflows/labeler.yml applies the path labels; combat, physics and
# bug are applied by hand. A pull request lands in the first category whose
# labels it carries, and anything unlabelled lands under "Other changes".

changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - question
  categories:
    - title: "Bot AI, tactics and combat"
      labels:
        - ai
        - combat
    - title: "Locomotion and physics"
      labels:
        - physics
    - title: "Navigation and map support"
      labels:
        - navigation
        - maps
    - title: "Bug fixes and engine compatibility"
      labels:
        - bug
    - title: "Lab, telemetry and tooling"
      labels:
        - rust-mcp
        - tooling
    - title: "Documentation and community"
      labels:
        - documentation
    - title: "Dependencies and CI"
      labels:
        - dependencies
        - github_actions
    - title: "Other changes"
      labels:
        - "*"
