# Dependabot version updates for Argus
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Commit messages use Dependabot's default sentence-case "Bump ..." subject,
# which matches the project's commit style. Every updater waits a week after
# a release before proposing it (cooldown), so a compromised or broken
# release has time to be yanked first. Security updates are not delayed.

version: 2
updates:
  - package-ecosystem: "github-actions"
    # covers .github/workflows and the local composite actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/tools/argus_mcp"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "rust-mcp"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    # tools/requirements-*.txt: pinned analysis dependencies for the cohort tests
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "tooling"
    groups:
      python:
        patterns:
          - "*"
